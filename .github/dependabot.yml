# Keeps the SHA-pinned GitHub Actions in build-release.yml current. All actions
# are pinned to full commit SHAs (not mutable tags); Dependabot opens PRs with
# SHA-only bumps, which are safe to review and merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
